server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: sie-operator
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:9000/realms/sie}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: ${OTEL_SAMPLING_PROBABILITY:1.0}

op:
  definition-manager:
    url: ${DEFINITION_MANAGER_URL:http://localhost:8080}
  security:
    oauth2-login-enabled: ${OP_OAUTH2_LOGIN_ENABLED:false}

otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
